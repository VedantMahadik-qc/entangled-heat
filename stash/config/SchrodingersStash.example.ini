; Schrodinger's Stash config.
; Copy to <GTA V folder>\scripts\SchrodingersStash.ini, then add your own key.
; Get a free key at https://platform.mothquantum.com (API keys page).
; NEVER share the real SchrodingersStash.ini.

[Atlas]
ApiKey=
ApiBase=https://api.mothquantum.com
; emu  = perfect simulator: partners are ALWAYS opposite
; fake = noisy snapshot of a real IBM chip: about 1 pair in 70 breaks the rule (jackpot or bust)
; qpu  = real IBM hardware (queues can be long; falls back to the simulator if unavailable)
Mode=fake
; IBM chip for fake mode, e.g. marrakesh, fez, torino, kyiv
Backend=marrakesh

[Gameplay]
; Key that starts (or abandons) a stash run
StartKey=F9
CashPerStash=10000
; Wanted stars when you open an empty stash (0 = no alarm)
AlarmStars=2
RunMinutes=10
; Replay cached real Atlas results when the API is unreachable (shown as OFFLINE)
OfflineFallback=true
; Texts from Erwin during a run
PhoneTexts=true
