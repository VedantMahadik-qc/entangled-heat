; Entangled Heat config.
; Copy to <GTA V folder>\scripts\EntangledHeat.ini (and to config\EntangledHeat.ini
; for the probe script), then add your own key.
; Get a free key at https://platform.mothquantum.com (API keys page).
; NEVER commit or share the real EntangledHeat.ini.

[Atlas]
ApiKey=
ApiBase=https://api.mothquantum.com
; Run high wanted levels on real IBM quantum hardware (results arrive later; simulator fills in meanwhile)
UseIbm=true
IbmFromWantedLevel=4
; Measure every police collapse with its own brand-new Atlas job (false = reuse one job's 1024 shots)
FreshJobPerCollapse=true

[Gameplay]
EnableHeatSystem=true
; Hand the police back to the game during story missions (they script their own chases)
PauseDuringMissions=true
EnableSuperposedHideouts=true
EnableSearchGrid=true
; Seconds between police collapses while wanted
CollapseIntervalSeconds=20
; Replay cached real Atlas results when the API is unreachable (shown as OFFLINE)
OfflineFallback=true
; Texts from "Uncle Shor" during chases, and one-time help tips
PhoneTexts=true
Tips=true

[Controls]
; Switch quantum police on/off to compare with vanilla GTA police
ToggleKey=F10
