; Quantum Getaway config.
; Copy to <GTA V folder>\scripts\QuantumGetaway.ini, then add your own key.
; Get a free key at https://platform.mothquantum.com (API keys page).
; NEVER share the real QuantumGetaway.ini.

[Atlas]
; Leave empty if you also have Entangled Heat: its key (scripts\EntangledHeat.ini) is used.
ApiKey=
ApiBase=https://api.mothquantum.com
; sim  = exact simulation of the Quantum Blur circuit (sharpest fractal echoes)
; fake = noisy snapshot of a real IBM chip: the landing map is estimated from 4096 measured shots
; qpu  = real IBM hardware (queues can be long; falls back to the simulator if unavailable)
Mode=sim
; Entangled orb pairs (graph-v1): emu = perfect simulator (partners always opposite),
; fake = noisy snapshot of a real IBM chip (now and then BOTH orbs come out gold), qpu = real IBM hardware
OrbMode=fake
; Also run them on real IBM quantum hardware (about a minute per job): those real measurements take
; over as soon as a job finishes, and the game carries on with OrbMode until then or if IBM is unavailable
OrbHardware=true
; IBM chip for fake/qpu, e.g. marrakesh, fez, torino
Backend=marrakesh

[Gameplay]
; Keyboard key that opens a portal
TunnelKey=T
; Controllers: L3 (left stick click) opens a portal
ControllerL3=true
; Portal charges: start with this many, hold at most MaxCharges. Drive through quantum orbs for more.
StartCharges=1
MaxCharges=3
; Quantum orbs kept on the streets around you (purple dots on the map, in entangled pairs), and how many while you're wanted
Orbs=4
OrbsWanted=8
; An unused portal closes after this many seconds and refunds the charge
PortalSeconds=6
; Metres per grid cell (the exit grid reaches 31 cells ahead and about 15 to each side)
CellSize=8
; While wanted, police keep searching the spot where you went into the portal
ShakePolice=true
; Use cached real Atlas results when the API is unreachable (shown as CACHED)
OfflineFallback=true
